name: Atualizar mercado

on:
  schedule:
    - cron: '30 11,21 * * *'   # 8h30 e 18h30 no horário de Brasília
  workflow_dispatch: {}          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Coletar preços e notícias
        run: node robo/gerar.js
      - name: Salvar mercado.json
        run: |
          git config user.name "robo-de-mercado"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mercado.json
          git diff --cached --quiet || git commit -m "Mercado $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
